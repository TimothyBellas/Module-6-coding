<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Search JSONPlaceholder users by name or email in real time.">
  <title>Live User Search</title>

  <style>
    /* Reset default browser spacing and simplify box sizing. */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f1f5f9;
      color: #1e293b;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 1rem;
      line-height: 1.5;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      color: #ffffff;
      padding: 3.5rem 1.25rem 5.5rem;
      text-align: center;
    }

    header p {
      color: #bfdbfe;
      margin: 0.75rem auto 0;
      max-width: 36rem;
    }

    h1 {
      font-size: clamp(2rem, 7vw, 3.25rem);
      line-height: 1.1;
    }

    main {
      margin: -3rem auto 0;
      max-width: 68rem;
      padding: 0 1.25rem 3rem;
    }

    .search-panel {
      background-color: #ffffff;
      border-radius: 1rem;
      box-shadow: 0 0.75rem 2rem rgba(15, 23, 42, 0.14);
      padding: 1.5rem;
    }

    label {
      color: #0f172a;
      display: block;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    input {
      border: 2px solid #cbd5e1;
      border-radius: 0.65rem;
      color: #0f172a;
      font: inherit;
      padding: 0.9rem 1rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      width: 100%;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 0.2rem rgba(37, 99, 235, 0.18);
      outline: none;
    }

    input:disabled {
      background-color: #f8fafc;
      cursor: wait;
    }

    #result-count {
      color: #475569;
      margin-top: 0.75rem;
      min-height: 1.5rem;
    }

    #result-count.error {
      color: #b91c1c;
      font-weight: 700;
    }

    .user-grid {
      display: grid;
      gap: 1.25rem;
      grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
      margin-top: 2rem;
    }

    .user-card {
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 0.85rem;
      box-shadow: 0 0.25rem 0.8rem rgba(15, 23, 42, 0.08);
      padding: 1.4rem;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }

    .user-card:hover {
      box-shadow: 0 0.65rem 1.4rem rgba(15, 23, 42, 0.14);
      transform: translateY(-0.2rem);
    }

    .user-card h2 {
      color: #0f172a;
      font-size: 1.25rem;
      line-height: 1.3;
      margin-bottom: 1.1rem;
    }

    .user-detail {
      color: #475569;
      overflow-wrap: anywhere;
    }

    .user-detail + .user-detail {
      margin-top: 0.65rem;
    }

    .detail-label {
      color: #1e3a8a;
      font-weight: 700;
    }

    .user-detail a {
      color: #1d4ed8;
    }

    .user-detail a:hover,
    .user-detail a:focus-visible {
      color: #1e40af;
    }

    .empty-message {
      background-color: #ffffff;
      border: 1px dashed #94a3b8;
      border-radius: 0.85rem;
      color: #475569;
      grid-column: 1 / -1;
      padding: 2rem;
      text-align: center;
    }

    @media (max-width: 36rem) {
      header {
        padding-top: 2.5rem;
      }

      .search-panel {
        padding: 1.2rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      input,
      .user-card {
        transition: none;
      }

      .user-card:hover {
        transform: none;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Live User Search</h1>
    <p>Search the directory by name or email address.</p>
  </header>

  <main>
    <section class="search-panel" aria-labelledby="search-label">
      <label id="search-label" for="search-input">Search users</label>
      <input
        id="search-input"
        type="search"
        placeholder="Try a name or email..."
        autocomplete="off"
        disabled
      >
      <p id="result-count" role="status" aria-live="polite">Loading users...</p>
    </section>

    <section
      id="user-grid"
      class="user-grid"
      aria-label="User search results"
      aria-busy="true"
    ></section>
  </main>

  <script>
    const USERS_URL = "https://jsonplaceholder.typicode.com/users";

    // Keep the fetched data so filtering never needs another API request.
    let allUsers = [];

    const searchInput = document.getElementById("search-input");
    const resultCount = document.getElementById("result-count");
    const userGrid = document.getElementById("user-grid");

    // Build one user card with DOM methods and textContent.
    function createUserCard(user) {
      const card = document.createElement("article");
      card.className = "user-card";

      const name = document.createElement("h2");
      name.textContent = user.name;

      const email = document.createElement("p");
      email.className = "user-detail";

      const emailLabel = document.createElement("span");
      emailLabel.className = "detail-label";
      emailLabel.textContent = "Email: ";

      const emailLink = document.createElement("a");
      emailLink.href = `mailto:${user.email}`;
      emailLink.textContent = user.email;

      email.append(emailLabel, emailLink);

      const company = document.createElement("p");
      company.className = "user-detail";

      const companyLabel = document.createElement("span");
      companyLabel.className = "detail-label";
      companyLabel.textContent = "Company: ";

      const companyName = document.createElement("span");
      companyName.textContent = user.company.name;

      company.append(companyLabel, companyName);
      card.append(name, email, company);

      return card;
    }

    // Clear the current cards and display the supplied list of users.
    function renderUsers(users) {
      userGrid.replaceChildren();

      if (users.length === 0) {
        const emptyMessage = document.createElement("p");
        emptyMessage.className = "empty-message";
        emptyMessage.textContent = "No users match your search.";
        userGrid.append(emptyMessage);
      } else {
        const fragment = document.createDocumentFragment();

        users.forEach(function (user) {
          fragment.append(createUserCard(user));
        });

        userGrid.append(fragment);
      }

      resultCount.textContent = `Showing ${users.length} of ${allUsers.length} users`;
    }

    // Filter stored users after every change to the search input.
    function filterUsers() {
      const searchTerm = searchInput.value.trim().toLowerCase();

      const matchingUsers = allUsers.filter(function (user) {
        const name = user.name.toLowerCase();
        const email = user.email.toLowerCase();

        return name.includes(searchTerm) || email.includes(searchTerm);
      });

      renderUsers(matchingUsers);
    }

    // Fetch the user list once when the page loads.
    async function loadUsers() {
      // Show a loading state until the request succeeds or fails.
      resultCount.textContent = "Loading users...";
      resultCount.classList.remove("error");
      searchInput.disabled = true;
      userGrid.replaceChildren();
      userGrid.setAttribute("aria-busy", "true");

      try {
        const response = await fetch(USERS_URL);

        if (!response.ok) {
          throw new Error(`Request failed with status ${response.status}`);
        }

        const users = await response.json();

        if (!Array.isArray(users)) {
          throw new Error("The API returned an unexpected response.");
        }

        allUsers = users;
        renderUsers(allUsers);
        searchInput.disabled = false;
        userGrid.setAttribute("aria-busy", "false");
      } catch (error) {
        console.error("Unable to load users:", error);
        userGrid.replaceChildren();
        resultCount.textContent = "Unable to load users. Please try again later.";
        resultCount.classList.add("error");
        userGrid.setAttribute("aria-busy", "false");
      }
    }

    searchInput.addEventListener("input", filterUsers);
    loadUsers();
  </script>
</body>
</html>
